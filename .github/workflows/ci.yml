name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The newest SDK builds every target framework; the older entries are here for
          # their runtimes, which `dotnet test` needs to execute those legs.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Pinqponq.Nugets.sln

      - name: Build
        run: dotnet build Pinqponq.Nugets.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Pinqponq.Nugets.sln
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"
        env:
          # Integration tests use Testcontainers; fail fast if Docker is unavailable.
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Pack
        run: dotnet pack Pinqponq.Nugets.sln -c Release --no-build -o ./artifacts/nupkg

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            ./TestResults/**/coverage.cobertura.xml
            ./TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 14
