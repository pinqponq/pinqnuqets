name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The newest SDK builds every target framework; the older entries are here for
          # their runtimes, which `dotnet test` needs to execute those legs.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Pinqponq.Nugets.sln

      - name: Build
        run: dotnet build Pinqponq.Nugets.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Pinqponq.Nugets.sln
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"
        env:
          # Integration tests use Testcontainers; fail fast if Docker is unavailable.
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Pack
        run: dotnet pack Pinqponq.Nugets.sln -c Release --no-build -o ./artifacts/nupkg

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            ./TestResults/**/coverage.cobertura.xml
            ./TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            ./artifacts/nupkg/*.nupkg
            ./artifacts/nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    # Runs only after a merge to master. A package version that is already on nuget.org is
    # skipped, so only packages whose <Version> was raised are published.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # lets the job ask GitHub for the OIDC token that nuget.org trusts

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: nuget.org exchanges GitHub's OIDC token for an API key that is valid
      # for one hour. No long-lived key is stored in this repository.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/nupkg/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
